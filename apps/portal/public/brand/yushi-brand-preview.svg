<text x="358" y="345" fill="#66695F" font-family="Arial, sans-serif" font-size="13" letter-spacing="4.4">THOUGHTFUL CODE REVIEW</text>
<text x="105" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#242722">An ancient duty. A modern eye for code.</text>
<text x="105" y="464" font-family="Arial, sans-serif" font-size="15" fill="#66695F">Inspired by the imperial censor: read closely, question carefully, uphold quality.</text>
